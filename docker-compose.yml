# Local Postgres for development. Start it with: docker compose up -d --wait
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
      POSTGRES_DB: game
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://game:game@db:5432/game?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports: 
      - "8080:8080"
    mem_limit: 512m

volumes:
  dbdata:
